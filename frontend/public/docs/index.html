<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Baglo Swagger API</title><link rel="stylesheet" href="/docs/swagger-ui.css"></head><body><div id="swagger-ui"></div><script src="/docs/swagger-ui-bundle.js"></script><script>
fetch('/config.json',{cache:'no-store'}).then(r=>r.json()).then(async config=>{const raw=config.api_base||'';const base=raw.endsWith('/')?raw.slice(0,-1):raw;const spec=await fetch(base+'/api/openapi.json').then(r=>r.json());spec.servers=[{url:base||location.origin}];SwaggerUIBundle({spec,dom_id:'#swagger-ui',deepLinking:true,persistAuthorization:false,validatorUrl:null});}).catch(()=>{document.getElementById('swagger-ui').textContent='文件載入失敗，請確認 API 與網路。';});
</script></body></html>
