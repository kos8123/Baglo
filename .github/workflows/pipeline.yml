name: Optional manual checks (deployment is AWS CodePipeline)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: pnpm/action-setup@v4
        with: {version: '11.25.0'}
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --experimental-strip-types --test tests/*.test.ts
      - run: cfn-lint infra/template.yaml infra/bootstrap.yaml infra/codepipeline.yaml
      - run: python scripts/build_frontend.py
      - run: bash -n scripts/deploy.sh
