AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Baglo paper-trading foundation - isolated serverless environment
Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
  PremarketScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
Resources:
  Ledger:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}]
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      Tags: [{Key: Project, Value: Baglo}, {Key: Environment, Value: !Ref Environment}]
  ResearchBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]
      VersioningConfiguration: {Status: Enabled}
  WebsiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]
      VersioningConfiguration: {Status: Enabled}
  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-website'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  WebHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-headers'
        SecurityHeadersConfig:
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: no-referrer, Override: true}
          StrictTransportSecurity: {AccessControlMaxAgeSec: 31536000, IncludeSubdomains: true, Override: true}
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.execute-api.${AWS::Region}.amazonaws.com https://*.auth.${AWS::Region}.amazoncognito.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: website
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            S3OriginConfig: {OriginAccessIdentity: ''}
            OriginAccessControlId: !GetAtt OriginAccess.Id
        DefaultCacheBehavior:
          TargetOriginId: website
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 413f1606-6a09-4c89-b4b0-43e5a38f39af
          ResponseHeadersPolicyId: !Ref WebHeaders
        ViewerCertificate: {CloudFrontDefaultCertificate: true}
  WebsitePolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
  Users:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      AdminCreateUserConfig: {AllowAdminCreateUserOnly: true}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy: {MinimumLength: 12, RequireLowercase: true, RequireUppercase: true, RequireNumbers: true, RequireSymbols: true}
  ApiScopes:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref Users
      Identifier: baglo-api
      Name: Baglo API
      Scopes: [{ScopeName: access, ScopeDescription: Access own paper account}]
  Client:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ApiScopes
    Properties:
      UserPoolId: !Ref Users
      ClientName: !Sub '${AWS::StackName}-web'
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, baglo-api/access]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub 'https://${Distribution.DomainName}/']
      LogoutURLs: [!Sub 'https://${Distribution.DomainName}/']
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      TokenValidityUnits: {AccessToken: hours}
  AuthDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref Users
      Domain: !Sub 'baglo-${Environment}-${AWS::AccountId}-${AWS::Region}'
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowOrigins: [!Sub 'https://${Distribution.DomainName}']
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [Authorization, Content-Type, Idempotency-Key]
        MaxAge: 300
      DefaultRouteSettings: {ThrottlingBurstLimit: 10, ThrottlingRateLimit: 5}
      Auth:
        DefaultAuthorizer: Cognito
        Authorizers:
          Cognito:
            AuthorizationScopes: [baglo-api/access]
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !GetAtt Users.ProviderURL
              audience: [!Ref Client]
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: own-ledger-and-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem]
                Resource: !GetAtt Ledger.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ApiLog.Arn
  ApiLog:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: 7
  Api:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      CodeUri: ../backend/
      Handler: baglo.api.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt ApiRole.Arn
      Environment:
        Variables:
          BAGLO_TABLE: !Ref Ledger
          BAGLO_ENV: !Ref Environment
          BAGLO_DEMO: '0'
          BAGLO_CLIENT_ID: !Ref Client
          BAGLO_AUTH_DOMAIN: !Sub 'https://${AuthDomain}.auth.${AWS::Region}.amazoncognito.com'
      Events:
        AllApi:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: '/api/{proxy+}', Method: ANY, PayloadFormatVersion: '2.0'}
        PublicHealth:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/health
            Method: GET
            PayloadFormatVersion: '2.0'
            Auth: {Authorizer: NONE}
        PublicConfig:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/config
            Method: GET
            PayloadFormatVersion: '2.0'
            Auth: {Authorizer: NONE}
  PremarketLog:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-premarket'
      RetentionInDays: 7
  PremarketRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: premarket-audit
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${ResearchBucket.Arn}/premarket/*'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt PremarketLog.Arn
  Premarket:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-premarket'
      CodeUri: ../backend/
      Handler: baglo.jobs.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 30
      Role: !GetAtt PremarketRole.Arn
      Environment:
        Variables: {BAGLO_DATA_BUCKET: !Ref ResearchBucket}
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {aws:SourceAccount: !Ref 'AWS::AccountId'}
      Policies:
        - PolicyName: invoke-premarket
          PolicyDocument:
            Version: '2012-10-17'
            Statement: [{Effect: Allow, Action: 'lambda:InvokeFunction', Resource: !GetAtt Premarket.Arn}]
  PremarketSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Premarket readiness audit only; analysis adapters not implemented
      ScheduleExpression: 'cron(10 8 ? * MON-FRI *)'
      ScheduleExpressionTimezone: Asia/Taipei
      State: !Ref PremarketScheduleState
      FlexibleTimeWindow: {Mode: 'OFF'}
      Target:
        Arn: !GetAtt Premarket.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{}'
        RetryPolicy: {MaximumEventAgeInSeconds: 300, MaximumRetryAttempts: 1}
Outputs:
  WebsiteUrl: {Value: !Sub 'https://${Distribution.DomainName}'}
  WebsiteBucket: {Value: !Ref WebsiteBucket}
  DistributionId: {Value: !Ref Distribution}
  ApiUrl: {Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'}
  UserPoolId: {Value: !Ref Users}
  DataBucket: {Value: !Ref ResearchBucket}
  LedgerTable: {Value: !Ref Ledger}
